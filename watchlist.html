<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウォッチリスト編集 | 高配当株ウォッチャー</title>
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1c1916;
      --muted: #6b6258;
      --card: #fffdf8;
      --line: #e4d8c4;
      --on: #1f7a4d;
      --on-bg: #e5f5eb;
      --off: #7a7268;
      --off-bg: #efeae1;
      --accent: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
    .lede, .meta { color: var(--muted); }
    .meta { font-size: .85rem; margin: .25rem 0 1rem; }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1rem 0 1.4rem; }
    a.btn, button.btn {
      display: inline-block;
      padding: .55rem .9rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 650;
      background: var(--ink);
      color: #fff;
      border: 0;
      cursor: pointer;
      font-size: .95rem;
    }
    a.btn.sub, button.btn.sub {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.btn.danger { background: var(--accent); }
    button.btn:disabled { opacity: .5; cursor: not-allowed; }
    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1rem;
      margin: 1rem 0;
    }
    label { display: block; font-size: .85rem; color: var(--muted); margin: .4rem 0 .2rem; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: .55rem .7rem;
      border: 1px solid var(--line);
      border-radius: .6rem;
      font: inherit;
      background: #fff;
    }
    .row { display: grid; gap: .5rem; grid-template-columns: 1fr auto; align-items: end; }
    .add-row { display: grid; gap: .5rem; grid-template-columns: 1fr auto; align-items: end; margin-top: .6rem; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item code { background: #efe7d8; padding: .05rem .35rem; border-radius: .3rem; }
    .status { min-height: 1.4em; font-size: .9rem; }
    .status.ok { color: var(--on); }
    .status.err { color: var(--accent); }
    footer { margin-top: 2rem; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ウォッチリストの編集</h1>
      <p class="lede">追加・削除して保存すると、非公開の <code>config.yaml</code> が更新されます。翌営業日の通知から反映されます。</p>
      <p class="meta">管理者のみ。トークンはこのブラウザのタブを閉じるまでだけ覚えます。ページには埋め込みません。</p>
      <div class="actions">
        <a class="btn sub" href="./">条件ページへ戻る</a>
      </div>
    </header>

    <section class="box">
      <strong>GitHub トークン</strong>
      <p class="meta">きめ細かな PAT で、リポジトリ <code>jp-stock-watcher</code> の <strong>Contents: Read and write</strong> が必要です。cron 用の Actions 権限だけでは保存できません。</p>
      <label for="token">Personal access token</label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
      <div class="actions">
        <button class="btn" id="load" type="button">読み込む</button>
        <button class="btn sub" id="forget" type="button">トークンを消す</button>
      </div>
    </section>

    <section class="box" id="editor" hidden>
      <strong>銘柄</strong>
      <div id="list"></div>
      <div class="add-row">
        <div>
          <label for="symbol">追加（7203 または 7203.T）</label>
          <input id="symbol" type="text" placeholder="7203.T" maxlength="16">
        </div>
        <button class="btn" id="add" type="button">追加</button>
      </div>
      <div class="actions">
        <button class="btn" id="save" type="button">保存する</button>
      </div>
    </section>

    <p class="status" id="status"></p>
    <footer>高配当株ウォッチャー / ウォッチリスト編集。サーバーは動かしていません。</footer>
  </main>
  <script>
    const REPO = "yasuoishigaki-stack/jp-stock-watcher";
    const PATH = "config.yaml";
    const TOKEN_KEY = "watchlist_gh_token";
    const state = { sha: "", yaml: "", entries: [] };

    const $ = (id) => document.getElementById(id);
    const status = (text, kind) => {
      $("status").textContent = text;
      $("status").className = "status" + (kind ? " " + kind : "");
    };

    function getToken() {
      return $("token").value.trim() || sessionStorage.getItem(TOKEN_KEY) || "";
    }

    function rememberToken(token) {
      $("token").value = token;
      sessionStorage.setItem(TOKEN_KEY, token);
    }

    function normalizeSymbol(raw) {
      let symbol = String(raw || "").trim().toUpperCase().replace(/．/g, ".");
      if (/^\d{4}$/.test(symbol)) symbol += ".T";
      if (/^\d{5}$/.test(symbol) && symbol.endsWith("0")) symbol = symbol.slice(0, 4) + ".T";
      return symbol;
    }

    function validSymbol(symbol) {
      return /^\d{4}\.T$/.test(symbol);
    }

    function parseWatchEntries(yaml) {
      const watchIdx = yaml.search(/^watch_list:\s*$/m);
      if (watchIdx < 0) throw new Error("watch_list が見つかりません");
      const afterWatch = yaml.slice(watchIdx);
      const endRel = afterWatch.slice(1).search(/\n[a-zA-Z_#]/);
      const chunk = endRel < 0 ? afterWatch : afterWatch.slice(0, endRel + 1);
      const entries = [];
      const seen = new Set();
      const parts = chunk.split(/^[ \t]+-[ \t]+symbol:/m);
      for (let i = 1; i < parts.length; i += 1) {
        const part = parts[i];
        const symbolMatch = part.match(/^[ \t]*["']?([^"'\s#]+)["']?/);
        if (!symbolMatch) continue;
        const symbol = normalizeSymbol(symbolMatch[1]);
        if (!symbol || seen.has(symbol)) continue;
        seen.add(symbol);
        const price = part.match(/^[ \t]+target_price:[ \t]*([0-9.]+)/m);
        const yld = part.match(/^[ \t]+target_yield:[ \t]*([0-9.]+)/m);
        entries.push({
          symbol,
          target_price: price ? Number(price[1]) : null,
          target_yield: yld ? Number(yld[1]) : null,
        });
      }
      return entries;
    }

    function formatSymbols(entries) {
      return entries.map((item) => {
        let block = `    - symbol: "${item.symbol}"\n`;
        if (item.target_price != null && !Number.isNaN(item.target_price)) {
          block += `      target_price: ${item.target_price}\n`;
        }
        if (item.target_yield != null && !Number.isNaN(item.target_yield)) {
          block += `      target_yield: ${item.target_yield}\n`;
        }
        return block;
      }).join("");
    }

    function replaceWatchSymbols(yaml, entries) {
      const watchIdx = yaml.search(/^watch_list:\s*$/m);
      if (watchIdx < 0) throw new Error("watch_list が見つかりません");
      const afterWatch = yaml.slice(watchIdx);
      const symMatch = afterWatch.match(/^[ \t]+symbols:[ \t]*\r?\n/m);
      if (!symMatch) throw new Error("symbols が見つかりません");
      const absSym = watchIdx + afterWatch.indexOf(symMatch[0]);
      let cursor = absSym + symMatch[0].length;
      while (cursor < yaml.length) {
        const nextNl = yaml.indexOf("\n", cursor);
        const line = (nextNl < 0 ? yaml.slice(cursor) : yaml.slice(cursor, nextNl + 1));
        const body = line.replace(/\r?\n$/, "");
        if (body === "") break;
        if (/^[a-zA-Z_#]/.test(body)) break;
        if (/^[ \t]/.test(body)) {
          cursor += line.length;
          continue;
        }
        break;
      }
      return yaml.slice(0, absSym) + "  symbols:\n" + formatSymbols(entries) + yaml.slice(cursor);
    }

    function renderList() {
      const root = $("list");
      root.innerHTML = "";
      if (!state.entries.length) {
        root.innerHTML = "<p class='meta'>銘柄はまだありません。</p>";
        return;
      }
      state.entries.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "item";
        const extra = [];
        if (item.target_price != null) extra.push("目標株価 " + item.target_price);
        if (item.target_yield != null) extra.push("目標利回り " + item.target_yield + "%");
        row.innerHTML = `<div><code></code>${extra.length ? " / " + extra.join(" / ") : " / 通常監視"}</div>`;
        row.querySelector("code").textContent = item.symbol;
        const del = document.createElement("button");
        del.className = "btn sub";
        del.type = "button";
        del.textContent = "削除";
        del.addEventListener("click", () => {
          state.entries.splice(index, 1);
          renderList();
        });
        row.appendChild(del);
        root.appendChild(row);
      });
    }

    async function github(path, options) {
      const token = getToken();
      if (!token) throw new Error("トークンを入力してください");
      const response = await fetch("https://api.github.com" + path, {
        ...options,
        headers: {
          Authorization: "Bearer " + token,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options && options.headers),
        },
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error("GitHub API " + response.status + " " + text.slice(0, 180));
      }
      return response;
    }

    async function loadConfig() {
      status("読み込み中…");
      const token = getToken();
      rememberToken(token);
      const response = await github("/repos/" + REPO + "/contents/" + PATH);
      const data = await response.json();
      const yaml = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
      state.sha = data.sha;
      state.yaml = yaml;
      state.entries = parseWatchEntries(yaml);
      $("editor").hidden = false;
      renderList();
      status("読み込みました（" + state.entries.length + "銘柄）", "ok");
    }

    async function saveConfig() {
      status("保存中…");
      const latest = await (await github("/repos/" + REPO + "/contents/" + PATH)).json();
      const current = decodeURIComponent(escape(atob(latest.content.replace(/\n/g, ""))));
      const next = replaceWatchSymbols(current, state.entries);
      const body = {
        message: "ウォッチリストを画面から更新",
        content: btoa(unescape(encodeURIComponent(next))),
        sha: latest.sha,
        branch: "main",
      };
      await github("/repos/" + REPO + "/contents/" + PATH, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      status("保存しました。翌営業日の通知から使われます。", "ok");
      await loadConfig();
    }

    $("load").addEventListener("click", () => {
      loadConfig().catch((err) => status(err.message, "err"));
    });
    $("forget").addEventListener("click", () => {
      sessionStorage.removeItem(TOKEN_KEY);
      $("token").value = "";
      $("editor").hidden = true;
      status("トークンを消しました");
    });
    $("add").addEventListener("click", () => {
      const symbol = normalizeSymbol($("symbol").value);
      if (!validSymbol(symbol)) {
        status("銘柄コードは 7203 または 7203.T の形で入力してください", "err");
        return;
      }
      if (state.entries.some((item) => item.symbol === symbol)) {
        status(symbol + " はすでに入っています", "err");
        return;
      }
      state.entries.push({ symbol, target_price: null, target_yield: null });
      $("symbol").value = "";
      renderList();
      status(symbol + " を追加しました。保存するを押すと反映されます。", "ok");
    });
    $("save").addEventListener("click", () => {
      saveConfig().catch((err) => status(err.message, "err"));
    });
    $("symbol").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        $("add").click();
      }
    });

    const saved = sessionStorage.getItem(TOKEN_KEY);
    if (saved) {
      $("token").value = saved;
    }
  </script>
</body>
</html>
